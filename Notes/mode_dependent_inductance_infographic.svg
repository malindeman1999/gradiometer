<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2700" viewBox="0 0 1600 2700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#e7eef8"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b3c5d"/>
      <stop offset="100%" stop-color="#11698e"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Segoe UI', Tahoma, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 24px 'Segoe UI', Tahoma, sans-serif; fill: #dcecff; }
      .section { font: 700 34px 'Segoe UI', Tahoma, sans-serif; fill: #0b3c5d; }
      .label { font: 700 24px 'Segoe UI', Tahoma, sans-serif; fill: #0b3c5d; }
      .body { font: 400 22px 'Segoe UI', Tahoma, sans-serif; fill: #1f2a35; }
      .small { font: 400 20px 'Consolas', 'Courier New', monospace; fill: #1f2a35; }
      .chip { font: 700 20px 'Segoe UI', Tahoma, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#355c7d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="2700" fill="url(#bg)"/>

  <rect x="0" y="0" width="1600" height="220" fill="url(#header)"/>
  <text x="70" y="95" class="title">Mode-Dependent Inductance: Practical Upgrade Path</text>
  <text x="70" y="145" class="subtitle">From one global inductive scale to l-dependent spectral loading</text>
  <text x="70" y="185" class="subtitle">Based on Notes/mode_dependent_inductance_note.md</text>

  <!-- Problem -->
  <rect x="60" y="270" rx="18" ry="18" width="1480" height="210" fill="#ffffff" stroke="#c7d7ea" stroke-width="2"/>
  <text x="90" y="325" class="section">1) Problem with a Single Inductance Scale</text>
  <text x="90" y="375" class="body">Current model uses one reactance for every mode:</text>
  <text x="90" y="412" class="small">X_s = omega * mu0 * R / 2 * inductance_scale</text>
  <text x="90" y="452" class="body">This forces all degrees l to have the same inductive phase behavior, which is not spectrally realistic.</text>

  <!-- Current vs Proposed -->
  <rect x="60" y="530" rx="18" ry="18" width="720" height="360" fill="#fff9f3" stroke="#f0c9a5" stroke-width="2"/>
  <text x="90" y="585" class="label">Current (Global)</text>
  <text x="90" y="635" class="small">X_s = omega * L_eff</text>
  <text x="90" y="670" class="small">L_eff = mu0 * R / 2 * scale</text>
  <text x="90" y="720" class="body">Same inductive loading for all l,m.</text>
  <text x="90" y="760" class="body">Good as a tuning knob, weak physical detail.</text>
  <rect x="90" y="790" rx="12" ry="12" width="250" height="44" fill="#ff9c43"/>
  <text x="110" y="820" class="chip">One-size-fits-all</text>

  <rect x="820" y="530" rx="18" ry="18" width="720" height="360" fill="#f4fbf6" stroke="#a6d9b6" stroke-width="2"/>
  <text x="850" y="585" class="label">Proposed (Mode-Dependent)</text>
  <text x="850" y="635" class="small">X_l = omega * L_l</text>
  <text x="850" y="670" class="small">L_l = mu0 * R * c_l</text>
  <text x="850" y="720" class="body">Different phase/amplitude loading per degree l.</text>
  <text x="850" y="760" class="body">Better alignment with spectral self-field scaling.</text>
  <rect x="850" y="790" rx="12" ry="12" width="270" height="44" fill="#2e8b57"/>
  <text x="870" y="820" class="chip">l-aware inductive lag</text>

  <line x1="780" y1="710" x2="815" y2="710" stroke="#355c7d" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Equations -->
  <rect x="60" y="940" rx="18" ry="18" width="1480" height="370" fill="#ffffff" stroke="#c7d7ea" stroke-width="2"/>
  <text x="90" y="995" class="section">2) Spectral Formulation to Implement</text>
  <text x="90" y="1045" class="body">Use an l-dependent filter on spectral admittance instead of a single complex scalar:</text>
  <text x="90" y="1090" class="small">tau_l = L_l * Y_ref</text>
  <text x="90" y="1130" class="small">H_l = 1 / (1 + i * omega * tau_l)</text>
  <text x="90" y="1170" class="small">Y_lm_eff = H_l * Y_lm_ohmic</text>
  <text x="90" y="1220" class="body">Interpretation: each degree l gets an RL-like low-pass + phase lag.</text>
  <text x="90" y="1260" class="body">Keep m-structure from physics/data; apply one complex multiplier per l across m.</text>

  <!-- Profiles -->
  <rect x="60" y="1360" rx="18" ry="18" width="1480" height="300" fill="#ffffff" stroke="#c7d7ea" stroke-width="2"/>
  <text x="90" y="1415" class="section">3) Candidate Degree Profiles c_l</text>

  <rect x="90" y="1450" rx="12" ry="12" width="450" height="180" fill="#eef6ff" stroke="#bfd7f3" stroke-width="2"/>
  <text x="115" y="1492" class="label">A) Geometry profile</text>
  <text x="115" y="1535" class="small">c_l = 1 / (2*l + 1)</text>
  <text x="115" y="1575" class="body">Simple, stable, physically plausible.</text>

  <rect x="575" y="1450" rx="12" ry="12" width="450" height="180" fill="#eefaf2" stroke="#bfe6cb" stroke-width="2"/>
  <text x="600" y="1492" class="label">B) Self-coupling matched</text>
  <text x="600" y="1535" class="small">c_l ~ 1 / ((2*l+1) * (l*(l+1))^2)</text>
  <text x="600" y="1575" class="body">Tracks existing S_l * F_l scaling.</text>

  <rect x="1060" y="1450" rx="12" ry="12" width="450" height="180" fill="#fff3f6" stroke="#f2bfd0" stroke-width="2"/>
  <text x="1085" y="1492" class="label">C) Calibrated family</text>
  <text x="1085" y="1535" class="small">c_l = c0 / (2*l + 1)^p</text>
  <text x="1085" y="1575" class="body">Fit p and c0 to reference runs.</text>

  <!-- Why plausible -->
  <rect x="60" y="1710" rx="18" ry="18" width="1480" height="430" fill="#ffffff" stroke="#c7d7ea" stroke-width="2"/>
  <text x="90" y="1765" class="section">4) Why These Scalings Are Physically Plausible</text>

  <rect x="90" y="1800" rx="12" ry="12" width="450" height="300" fill="#eef6ff" stroke="#bfd7f3" stroke-width="2"/>
  <text x="115" y="1840" class="label">A) Geometry profile rationale</text>
  <text x="115" y="1880" class="body">- Many spherical coupling factors include</text>
  <text x="115" y="1912" class="body">  a (2*l+1) denominator.</text>
  <text x="115" y="1950" class="body">- Higher l means smaller loops and weaker</text>
  <text x="115" y="1982" class="body">  global inductive leverage.</text>
  <text x="115" y="2020" class="body">- Gives stable monotone decay.</text>

  <rect x="575" y="1800" rx="12" ry="12" width="450" height="300" fill="#eefaf2" stroke="#bfe6cb" stroke-width="2"/>
  <text x="600" y="1840" class="label">B) Self-coupling rationale</text>
  <text x="600" y="1880" class="body">- Mirrors internal operator physics:</text>
  <text x="600" y="1912" class="small">S_l ~ 1/((2*l+1)l(l+1))</text>
  <text x="600" y="1946" class="small">F_l ~ 1/(l(l+1))</text>
  <text x="600" y="1982" class="body">- So inductive feedback naturally shrinks</text>
  <text x="600" y="2014" class="body">  quickly at high l.</text>

  <rect x="1060" y="1800" rx="12" ry="12" width="450" height="300" fill="#fff3f6" stroke="#f2bfd0" stroke-width="2"/>
  <text x="1085" y="1840" class="label">C) Calibrated power-law rationale</text>
  <text x="1085" y="1880" class="body">- Real media add unresolved 3-D effects.</text>
  <text x="1085" y="1912" class="body">- One exponent p keeps model simple but</text>
  <text x="1085" y="1944" class="body">  lets data tune decay strength.</text>
  <text x="1085" y="1982" class="body">- Good reduced-order compromise.</text>

  <!-- Workflow -->
  <rect x="60" y="2190" rx="18" ry="18" width="1480" height="270" fill="#ffffff" stroke="#c7d7ea" stroke-width="2"/>
  <text x="90" y="2245" class="section">5) Where It Plugs Into the Current GUI Workflow</text>
  <text x="90" y="2295" class="body">Step 1: build sigma_s(grid)  -&gt;  SH transform  -&gt;  Y_lm_ohmic</text>
  <text x="90" y="2335" class="body">New step: build H_l from chosen c_l profile and multiply: Y_lm_eff(l,m)=H_l*Y_lm_ohmic(l,m)</text>
  <text x="90" y="2375" class="body">Step 3/5: unchanged solver path (Gaunt mixing, self-consistent matrix solve).</text>
  <line x1="370" y1="2298" x2="510" y2="2298" stroke="#355c7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="2298" x2="900" y2="2298" stroke="#355c7d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Validation -->
  <rect x="60" y="2510" rx="18" ry="18" width="1480" height="130" fill="#0b3c5d"/>
  <text x="90" y="2562" class="chip">Validation checklist:</text>
  <text x="360" y="2562" class="chip">1) recover global case when tau_l is constant</text>
  <text x="90" y="2600" class="chip">2) check cond(A)=cond(I-SM) for stability</text>
  <text x="700" y="2600" class="chip">3) compare emitted B amplitude/phase vs reference by degree</text>
  <text x="1220" y="2640" class="subtitle">Fast l-decay = more resistive high-l, slow l-decay = more high-l lag</text>
</svg>
